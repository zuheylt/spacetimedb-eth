[package]
name        = "eth-sidecar"
description = "Standalone Tokio binary: bridges Ethereum JSON-RPC with a SpacetimeDB instance"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true
repository.workspace  = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true

# sidecar is always std — it's a binary, not a wasm module
[features]
default = []
serde   = ["eth-core/serde", "eth-module/serde"]

[dependencies]
eth-core        = { path = "../eth-core", features = ["std"] }
eth-module      = { path = "../eth-module", features = ["std"] }
spacetimedb-sdk = { version = "2.1" }
tokio           = { version = "1", features = ["full"] }
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
toml            = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
